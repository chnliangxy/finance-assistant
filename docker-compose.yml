services:
  backend:
    build:
      context: ./backend
    environment:
      - PORT=3001
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    expose:
      - "3001"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend
    ports:
      - "6605:80"
    restart: unless-stopped
